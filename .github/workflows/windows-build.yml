name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build installer (NSIS + portable)
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dictofon-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
          generate_release_notes: true

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Screenshots + smoke test
        run: |
          npm run preview > preview.log 2>&1 &
          npx --yes wait-on@7 http://127.0.0.1:8080/index.html --timeout 60000
          node scripts/screenshot.mjs

      - name: Preview log
        if: always()
        run: cat preview.log

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Dictofon-screenshots
          path: |
            docs/screenshots/*.png
            docs/report.json
          if-no-files-found: warn
